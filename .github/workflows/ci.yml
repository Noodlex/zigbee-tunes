name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 matches the Docker images and the standalone runtime.
      # node:sqlite (used by the DB layer and its tests) is flagless here.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack (pinned Yarn 4)
        run: corepack enable

      # ---- Backend ----
      - name: Install backend deps
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build backend
        run: yarn build

      # ---- UI (separate package, its own lockfile) ----
      - name: Install UI deps
        run: yarn install --immutable
        working-directory: ui

      - name: Build UI
        run: yarn build
        working-directory: ui

  # Neither image is built anywhere else before it reaches a user. The app
  # declares no `image:` in config.yaml, so the Supervisor builds its
  # Dockerfile on each installation: a mistake in it surfaces as a failed
  # install on someone else's machine. Built here, never pushed.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build standalone image
        run: docker build --build-arg COMMIT_SHA="${GITHUB_SHA::7}" -t zigbee-tunes:ci .

      # The Supervisor's build context is addon/zigbee-tunes/, so that
      # Dockerfile cannot COPY the sources: it clones them from GitHub at
      # ZIGBEE_TUNES_REF. Point it at the branch under review, otherwise a PR
      # would build main's sources and prove nothing about its own.
      # A fork's branch does not exist in this repository, so a fork PR falls
      # back to main: its Dockerfile is still exercised, its sources are not.
      - name: Build Home Assistant app image
        env:
          SOURCE_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || 'main' }}
        run: >-
          docker build
          --build-arg ZIGBEE_TUNES_REF="$SOURCE_REF"
          -t zigbee-tunes-app:ci
          addon/zigbee-tunes
